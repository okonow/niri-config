[main]
# Прижимает окно к верху по центру
anchor=top

# Ширина в символах. Чтобы растянуть на весь экран,
# поставьте число больше, чем влезает символов (подберите под шрифт)
width=200
lines=47
# Расположение на слое overlay (поверх всех окон)
layer=overlay

# Цвета
[colors]
# Чёрный фон с прозрачностью: RRGGBBAA, где AA = прозрачность
background=000000cc

# Цвет текста (например, светло-серый для контраста)
text=cdd6f4ff

# Цвет выделенной строки (можно сделать чуть светлее фона)
selection=1e1e2eff
